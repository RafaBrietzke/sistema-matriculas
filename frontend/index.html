<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de atendimento e matrículas" />
    <title>MatrículaFácil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica o tema salvo antes do React carregar, para a tela não piscar no tema errado -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem('matriculafacil:tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        document.documentElement.setAttribute('data-bs-theme', tema === 'escuro' ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
